providers:
  - openai:gpt-4o-mini

prompts:
  - file://../prompts/rag/v1.txt
  - file://../prompts/rag/v2.txt

tests:
  - vars:
      context: "Company_A is a workforce management platform that helps retail and hospitality businesses manage employee schedules, track working hours, and handle payroll exports."
      question: "What industries does Company_A serve?"
    assert:
      - type: contains
        value: "retail"

  - vars:
      context: "Company_A integrates with payroll systems including ADP, Sage, and Datev. Exports are available in CSV and XML formats."
      question: "What export formats does Company_A support?"
    assert:
      - type: contains
        value: "CSV"

  - vars:
      context: "Company_A is available as a web application and a mobile app for iOS and Android. There is no desktop application."
      question: "Is Company_A available on mobile?"
    assert:
      - type: contains
        value: "iOS"

  - vars:
      context: "Company_A is a workforce management platform that helps retail and hospitality businesses manage employee schedules."
      question: "What is the monthly subscription price for Company_A?"
    assert:
      - type: contains
        value: "I don't know"

  - vars:
      context: "Company_A integrates with payroll systems including ADP, Sage, and Datev."
      question: "Does Company_A integrate with SAP?"
    assert:
      - type: contains
        value: "I don't know"

  - vars:
      context: "Company_A mobile app supports iOS and Android. Push notifications are available for shift reminders."
      question: "Who is the CEO of Company_A?"
    assert:
      - type: contains
        value: "I don't know"

  - vars:
      context: "Employees can submit time-off requests through the mobile app. Managers receive notifications and can approve or reject requests."
      question: "In what year was Company_A founded?"
    assert:
      - type: contains
        value: "I don't know"

  - vars:
      context: "Company_A supports GDPR compliance with data residency options in the EU. All data is encrypted at rest and in transit."
      question: "Is Company_A SOC 2 certified?"
    assert:
      - type: contains
        value: "I don't know"